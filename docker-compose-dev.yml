version: "3"

services:
  api:
    build:
      context: .
      args: 
        PYTHON_VERSION: ${PYTHON_VERSION}
    command: gunicorn main:app -w ${MAX_NUMBER_OF_JOB} -k uvicorn.workers.UvicornWorker --bind 0.0.0.0:5000 --timeout 300 --reload --log-level debug
    container_name: alligator_api
    env_file:
      - ./.env
    environment:
      - FLASK_DEBUG=1
      - PYTHONPATH=/app
    ports:
      - "${ALLIGATOR_PORT}:5000"
    restart: always
    volumes:
      - ./app:/app
    working_dir: /app
    
  mongo:
    image: "mongo:${MONGO_VERSION}"
    container_name: "alligator_mongo"
    ports:
      - "${MONGO_PORT}:27017"
    restart: always
    volumes:
      - ./mongo-data:/data/db

  jupyter:
    image: roby944/jupyter-extended
    container_name: alligator_jupyter
    env_file:
      - ./.env
    environment:
      - JUPYTER_ENABLE_LAB=yes
    ports:
      - "${JUPYTER_PORT}:8888"
    restart: always   
    volumes:
      - ./app:/home/jovyan/app
      - ./work:/home/jovyan/work